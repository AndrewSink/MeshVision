<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeshVision</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
    {
      "imports": {
        "three": "https://esm.sh/three@0.158.0",
        "three/examples/jsm/controls/OrbitControls": "https://esm.sh/three@0.158.0/examples/jsm/controls/OrbitControls.js",
        "three/examples/jsm/loaders/STLLoader.js": "https://esm.sh/three@0.158.0/examples/jsm/loaders/STLLoader.js",
        "three/examples/jsm/environments/RoomEnvironment.js": "https://esm.sh/three@0.158.0/examples/jsm/environments/RoomEnvironment.js",
        "chart.js/auto": "https://esm.sh/chart.js@4.4.0/auto"
      }
    }
    </script>
    <style>
        html, body { height: 100%; }
        #canvas-container > canvas { display: block; width: 100% !important; height: 100% !important; }
    </style>
</head>

<body class="h-full bg-slate-50 text-slate-900 antialiased">
    <div class="flex h-full flex-col">
        <header class="sticky top-0 z-10 flex items-center justify-between border-b border-slate-200 bg-white/90 px-6 py-3 backdrop-blur">
            <div class="flex items-center gap-2">
                <div class="h-8 w-8 rounded-lg bg-gradient-to-br from-sky-500 to-indigo-600"></div>
                <h1 class="text-lg font-semibold tracking-tight">MeshVision</h1>
                <a href="https://github.com/AndrewSink/MeshVision" target="_blank" rel="noopener noreferrer"
                    aria-label="View MeshVision on GitHub"
                    class="ml-1 inline-flex h-7 w-7 items-center justify-center rounded-md text-slate-500 transition hover:bg-slate-100 hover:text-slate-900">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" class="h-5 w-5">
                        <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.4 3-.405 1.02.005 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" />
                    </svg>
                </a>
            </div>
            <div class="flex items-center gap-2">
                <button id="uploadButton"
                    class="inline-flex items-center gap-2 rounded-lg bg-slate-900 px-4 py-2 text-sm font-medium text-white shadow-sm transition hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-offset-2">
                    Upload .STL
                </button>
                <input type="file" id="fileInput" accept=".stl" class="hidden">
                <button id="heatmapButton"
                    class="inline-flex items-center gap-2 rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-900 shadow-sm transition hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-offset-2">
                    Toggle heatmap
                </button>
            </div>
        </header>

        <main class="grid flex-1 min-h-0 grid-cols-1 gap-4 p-4 lg:grid-cols-3">
            <section class="lg:col-span-2 min-h-0 overflow-hidden rounded-xl bg-slate-100 shadow-inner ring-1 ring-slate-200">
                <div id="canvas-container" class="h-full w-full"></div>
            </section>

            <aside class="flex min-h-0 flex-col gap-4">
                <div class="rounded-xl bg-white p-4 shadow-sm ring-1 ring-slate-200">
                    <h2 class="text-sm font-semibold text-slate-700">Triangle statistics</h2>
                    <p class="mt-1 text-xs text-slate-500">Sizes of the triangles in your model</p>
                    <dl class="mt-4 grid grid-cols-2 gap-3 text-sm">
                        <div class="rounded-lg bg-slate-50 p-3 ring-1 ring-slate-200 col-span-2">
                            <dt class="text-xs uppercase tracking-wide text-slate-500">Total triangles</dt>
                            <dd id="stat-count" class="mt-1 text-xl font-semibold tabular-nums text-slate-900">—</dd>
                        </div>
                        <div class="rounded-lg bg-slate-50 p-3 ring-1 ring-slate-200">
                            <dt class="text-xs uppercase tracking-wide text-slate-500">Smallest</dt>
                            <dd id="stat-min" class="mt-1 text-base font-semibold tabular-nums text-slate-900">—</dd>
                        </div>
                        <div class="rounded-lg bg-slate-50 p-3 ring-1 ring-slate-200">
                            <dt class="text-xs uppercase tracking-wide text-slate-500">Typical</dt>
                            <dd id="stat-median" class="mt-1 text-base font-semibold tabular-nums text-slate-900">—</dd>
                        </div>
                        <div class="rounded-lg bg-slate-50 p-3 ring-1 ring-slate-200">
                            <dt class="text-xs uppercase tracking-wide text-slate-500">Average</dt>
                            <dd id="stat-mean" class="mt-1 text-base font-semibold tabular-nums text-slate-900">—</dd>
                        </div>
                        <div class="rounded-lg bg-slate-50 p-3 ring-1 ring-slate-200">
                            <dt class="text-xs uppercase tracking-wide text-slate-500">Largest</dt>
                            <dd id="stat-max" class="mt-1 text-base font-semibold tabular-nums text-slate-900">—</dd>
                        </div>
                    </dl>
                </div>

                <div class="flex min-h-0 flex-1 flex-col rounded-xl bg-white p-4 shadow-sm ring-1 ring-slate-200">
                    <h2 class="text-sm font-semibold text-slate-700">Size distribution</h2>
                    <p id="stat-summary" class="mt-1 text-xs text-slate-500">—</p>
                    <div class="relative mt-3 min-h-[220px] flex-1">
                        <canvas id="chart-canvas"></canvas>
                    </div>
                </div>
            </aside>
        </main>

        <footer class="flex items-center justify-center px-6 py-2 text-xs text-slate-500">
            <a href="https://andrewsink.xyz" class="hover:text-slate-900">Andrew Sink — 2026</a>
        </footer>
    </div>

    <script type="module" src="./src/script.js"></script>
</body>

</html>
